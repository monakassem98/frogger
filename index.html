<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Frogger: Science Cross Road</title>
<style>
:root{--bg:#0e2a47;--ink:#e9fff7;--acc:#ffd23f;--ok:#2fd67b;--bad:#ff5d73;--term:#08202b;--glow:#38f2c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
.game,.game *{user-select:none;-webkit-user-select:none}
textarea,input{user-select:text;-webkit-user-select:text}
.game{position:relative;max-width:520px;margin:0 auto;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
#hud{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:800;font-size:15px}
#hud span{display:flex;align-items:center;gap:4px}
#hearts{display:flex;gap:2px}
#wrap{position:relative}
canvas{display:block;border-radius:14px;touch-action:none;box-shadow:0 6px 0 #0006}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:26px;font-weight:900;color:#fff;text-shadow:0 3px 0 #000a;opacity:0;pointer-events:none;transition:opacity .25s}
#banner.on{opacity:1}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
#pad button{border:0;border-radius:16px;background:#ffd23f;box-shadow:0 4px 0 #b88a00;display:grid;place-items:center;padding:0}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:12px;z-index:5;overflow:auto}
.ov.on{display:flex}
.card{background:var(--term);border:3px solid var(--glow);border-radius:18px;padding:16px;width:min(480px,100%);box-shadow:0 0 28px #38f2c055}
.card h2{margin:0 0 8px;font-size:22px}
.card label{display:block;font-size:13px;margin:8px 0 3px}
.card input,.card select,.card textarea{width:100%;padding:9px;border-radius:10px;border:2px solid #38f2c066;background:#0d3040;color:var(--ink);font:inherit}
.btn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--acc);color:#2a2000;font-weight:900;font-size:17px;box-shadow:0 4px 0 #b88a00}
.opt{display:block;width:100%;margin:6px 0;padding:11px;border-radius:12px;border:2px solid #38f2c066;background:#0d3040;color:var(--ink);font:inherit;text-align:left}
.opt.sel{border-color:var(--acc);background:#27475a}
#fb{margin-top:8px;font-size:14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cmp div{background:#0d3040;border-radius:10px;padding:8px;font-size:13px}
.chip{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;padding:2px 9px;margin:2px;font-size:12px;font-weight:700}
.shake{animation:sh .45s}@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.tabs{display:flex;gap:4px;margin-top:6px}.tabs button{flex:1;padding:9px 2px;border:0;border-radius:10px 10px 0 0;background:#0d3040;color:var(--ink);font:inherit;font-size:13px;font-weight:700}.tabs button.on{background:var(--glow);color:#06202a}
.pane{display:none;padding-top:6px}.pane.on{display:block}.pc{width:min(720px,100%);max-height:94vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #38f2c033;padding:4px;text-align:left;vertical-align:top}
.sm{padding:8px 12px;border:0;border-radius:10px;background:var(--acc);color:#2a2000;font:inherit;font-weight:800;margin:6px 6px 0 0}
pre{background:#0d3040;padding:8px;border-radius:10px;font-size:11px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.lk{display:flex;gap:6px;align-items:center;margin:5px 0;font-size:12px}.lk input{flex:1;width:auto}.card input[type=checkbox]{width:auto}
.qi{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px solid #38f2c033;padding:5px 0}
</style></head><body>
<div class="game">
 <div id="hud"><span id="hearts"></span><span id="sc"></span><span id="gt"></span></div>
 <div id="wrap"><canvas id="c"></canvas><div id="banner"></div></div>
 <div id="pad">
  <button class="u" aria-label="Up" data-m="0,1"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 4l9 12H3z" fill="#3b2c00"/></svg></button>
  <button class="l" aria-label="Left" data-m="-1,0"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M4 12l12-9v18z" fill="#3b2c00"/></svg></button>
  <button class="d" aria-label="Down" data-m="0,-1"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 20L3 8h18z" fill="#3b2c00"/></svg></button>
  <button class="r" aria-label="Right" data-m="1,0"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M20 12L8 21V3z" fill="#3b2c00"/></svg></button>
 </div>
</div>

<div class="ov on" id="menu"><div class="card" style="text-align:center">
 <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><ellipse cx="38" cy="44" rx="26" ry="22" fill="#35c759"/><ellipse cx="38" cy="50" rx="15" ry="12" fill="#b9f5a0"/><circle cx="26" cy="24" r="10" fill="#fff"/><circle cx="50" cy="24" r="10" fill="#fff"/><circle cx="26" cy="25" r="5" fill="#111"/><circle cx="50" cy="25" r="5" fill="#111"/></svg>
 <h2>Frogger: Science Cross Road</h2>
 <p id="who" style="margin:0 0 4px;font-size:16px"></p>
 <button class="btn" id="go">Start crossing</button>
 <button class="btn" id="tp" style="background:#38f2c0;box-shadow:0 4px 0 #1b9a7d">Teacher Portal</button>
</div></div>

<div class="ov" id="portal"><div class="card pc">
 <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Teacher Portal</h2><button class="sm" id="pclose">Close</button></div>
 <div class="tabs" id="tabs"><button class="on" data-p="pq">Questions</button><button data-p="pl">Student Links</button><button data-p="ps">Sync</button><button data-p="pr">Results</button></div>
 <div class="pane on" id="pq">
  <div class="cmp"><div><label for="th">Theme</label><select id="th"><option>Day</option><option>Sunset</option><option>Night</option></select></div><div><label for="sp">Speed</label><select id="sp"><option>Slow</option><option>Normal</option><option>Fast</option></select></div></div>
  <label for="qt">Question type</label>
  <select id="qt"><option value="complete">Complete the sentence</option><option value="give_reason">Give a reason</option><option value="what_happens">What happens?</option><option value="correct">Correct the mistake</option><option value="mcq">Multiple choice</option></select>
  <label for="qtext">Question</label><textarea id="qtext" rows="2"></textarea>
  <div id="qmcq" style="display:none"><label>Choices (at least 2)</label><input id="mc0" placeholder="Choice 1"><input id="mc1" placeholder="Choice 2" style="margin-top:4px"><input id="mc2" placeholder="Choice 3" style="margin-top:4px"><input id="mc3" placeholder="Choice 4" style="margin-top:4px"><label for="mca">Correct choice</label><select id="mca"><option value="0">Choice 1</option><option value="1">Choice 2</option><option value="2">Choice 3</option><option value="3">Choice 4</option></select></div>
  <div id="qw"><label for="qk">Keywords (separate with |)</label><input id="qk" placeholder="density|expands|lattice"></div>
  <label for="qm">Model answer</label><textarea id="qm" rows="2"></textarea>
  <button class="sm" id="qadd">Add question</button><button class="sm" id="qreset">Reset to defaults</button><div id="qs" style="font-size:13px;margin-top:6px"></div>
  <div id="qlist"></div>
 </div>
 <div class="pane" id="pl">
  <label for="lcode">Class code</label><input id="lcode" value="CLASS1">
  <label for="lnames">Student names (one per line)</label><textarea id="lnames" rows="5"></textarea>
  <label><input type="checkbox" id="linc" checked> Put questions, theme, speed and sync URL inside each link</label>
  <button class="sm" id="lgen">Generate links</button><div id="links"></div>
 </div>
 <div class="pane" id="ps">
  <label for="surl">Google Apps Script Web App URL</label><input id="surl" placeholder="https://script.google.com/macros/s/.../exec">
  <button class="sm" id="stest">Send Test Row</button><button class="sm" id="scopy">Copy Apps Script</button><div id="ss" style="font-size:13px;margin-top:6px"></div>
  <pre id="snip">function doPost(e){
  var s=SpreadsheetApp.getActiveSheet();
  var d=JSON.parse(e.postData.contents);
  s.appendRow([d.time,d.name,d.gate,d.question,d.answer,d.correct,d.score,d.duration]);
  return ContentService.createTextOutput('ok');
}</pre>
 </div>
 <div class="pane" id="pr">
  <button class="sm" id="rcsv">Download CSV</button><button class="sm" id="rcopy">Copy CSV</button><button class="sm" id="rclr" style="background:var(--bad);color:#fff">Clear</button><div id="rs" style="font-size:13px;margin-top:6px"></div>
  <div style="overflow:auto"><table id="rt"></table></div>
 </div>
</div></div>

<div class="ov" id="gate"><div class="card" id="term">
 <h2 style="display:flex;gap:8px;align-items:center"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="#38f2c0" stroke-width="2"/><path d="M8 21h8M12 17v4M7 9l3 2-3 2M12 13h4" fill="none" stroke="#38f2c0" stroke-width="2" stroke-linecap="round"/></svg>Science Gate</h2>
 <div id="q" style="font-size:17px;font-weight:700"></div>
 <div id="body"></div>
 <button class="btn" id="sub">Unlock gate</button>
 <div id="fb"></div>
</div></div>

<div class="ov" id="end"><div class="card"><h2 id="et"></h2><p id="ep"></p><button class="btn" id="again">Play again</button></div></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d'),COLS=9,ROWS=10,GATES=3;
let cs=48;
const TH={Day:{grass:'#7bd35b',road:'#4b5160',water:'#2fa4e7',bank:'#b79cff',line:'#fff'},Sunset:{grass:'#d1b84a',road:'#5a4458',water:'#e0607e',bank:'#ff9e6b',line:'#ffe2a8'},Night:{grass:'#2f8f5b',road:'#262b3c',water:'#1d5fb0',bank:'#6b5bd1',line:'#9fb4ff'}};
const $=id=>document.getElementById(id),ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const TO=[],later=(f,ms)=>TO.push(window.setTimeout(f,ms));
const DEF=[
{type:'mcq',q:'Which gas do plants take in to make food by photosynthesis?',ch:['Oxygen','Carbon dioxide','Nitrogen','Helium'],a:1,m:'Carbon dioxide'},
{type:'complete',q:'Complete: Plants make food using sunlight, water and ____.',kw:['carbon dioxide'],m:'carbon dioxide'},
{type:'give_reason',q:'Give a reason why ice floats on liquid water.',kw:['density','expand','lattice'],m:'Water expands into a lattice as it freezes, so ice has a lower density than liquid water.'},
{type:'what_happens',q:'What happens to a green plant kept in the dark for a week?',kw:['photosynth','food','yellow'],m:'It cannot photosynthesise, makes no food, turns yellow and weakens.'},
{type:'correct',q:'Correct the mistake: The Moon makes its own light.',kw:['reflect','sun'],m:'The Moon does not make light; it reflects sunlight.'},
{type:'mcq',q:'Which planet is known as the Red Planet?',ch:['Venus','Jupiter','Mars','Mercury'],a:2,m:'Mars'},
{type:'give_reason',q:'Give a reason why Earth has seasons.',kw:['tilt','orbit','sunlight'],m:'Earth’s axis is tilted as it orbits the Sun, so sunlight hits each hemisphere differently through the year.'}];
let QS=ld('fsq_q',null);if(!Array.isArray(QS)||!QS.length)QS=DEF.slice();
let CFG=ld('fsq_cfg',{th:'Day',sp:'Normal'});
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const sig=(n,c)=>h53(n+'|'+c+'|frogsci1');
function cp(t){const f=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove()};try{navigator.clipboard.writeText(t).catch(f)}catch(e){f()}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={st:'menu',hearts:3,score:0,round:0,mult:1,mist:0,order:[],q:null,mul:1,sink:0,leap:0,th:TH.Day,name:''};
let lanes=[],frog={x:4,r:0,maxr:0,dx:4,dr:0,ang:0},parts=[],T=0,pick=null,last=0;

function size(){cs=Math.max(28,Math.min(56,(innerWidth-20)/COLS,(innerHeight-250)/ROWS));const d=devicePixelRatio||1;C.width=COLS*cs*d;C.height=ROWS*cs*d;C.style.width=COLS*cs+'px';C.style.height=ROWS*cs+'px';X.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);

/* audio */
let AC;function tone(f,d,ty='sine',v=.15,dl=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+dl;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={hop:()=>tone(520,.08,'square',.06),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.12)),buzz:()=>tone(120,.35,'sawtooth',.15),alarm:()=>[880,660,880,660].forEach((f,i)=>tone(f,.15,'square',.1,i*.16)),die:()=>tone(200,.4,'sawtooth',.12)};

/* world */
function build(){lanes=[];const m=S.mul*(1+S.round*.2);
 for(let r=1;r<=4;r++){const dir=r%2?1:-1,tr=r%2===0,w=tr?2.4:1.4,n=tr?2:3;lanes.push({r,dir,sp:(1.1+r*.25)*m,k:'road',w,o:[...Array(n)].map((_,i)=>({x:i*(COLS+6)/n+r,w,c:['#ef476f','#ffd23f','#4cc9f0','#f78c1f'][(r+i)%4]}))})}
 for(let r=6;r<=8;r++){const dir=r%2?-1:1,log=r!==7,w=log?2.6:1.3,n=log?3:5;lanes.push({r,dir,sp:(.8+(r-5)*.2)*m,k:log?'log':'pad',w,o:[...Array(n)].map((_,i)=>({x:i*(COLS+6)/n+r*.7,w}))})}}
function reset(){frog={x:4,r:0,maxr:0,dx:4,dr:0,ang:0}}
function banner(t,ms=1500){const b=document.getElementById('banner');b.textContent=t;b.classList.add('on');later(()=>b.classList.remove('on'),ms)}
function hud(){const h=document.getElementById('hearts');h.innerHTML=[0,1,2].map(i=>`<svg width="24" height="22" viewBox="0 0 24 22"><path d="M12 21C5 15 1 11 1 6.500 1 3 3.500 1 6.500 1 9 1 11 2.500 12 5 13 2.500 15 1 17.500 1 20.500 1 23 3 23 6.500 23 11 19 15 12 21z" fill="${i<S.hearts?'#ff4d6d':'#3a4a66'}"/></svg>`).join('');document.getElementById('sc').textContent='Score '+S.score+'  x'+S.mult;document.getElementById('gt').textContent='Gate '+Math.min(S.round+1,GATES)+'/'+GATES}
function burst(x,y,n=60){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:1,c:['#ffd23f','#ff4d6d','#4cc9f0','#7bd35b','#fff'][i%5],s:Math.random()<.5})}}

function die(why){if(S.st!=='play')return;sfx.die();S.hearts--;burst((frog.x+.5)*cs,(ROWS-.5-frog.r)*cs,18);banner(why,900);hud();if(S.hearts<=0)return finish(false);reset()}
function move(dx,dy){if(S.st!=='play')return;const river=frog.r>=6&&frog.r<=8;let nx=dx?(river?frog.x+dx:Math.round(frog.x)+dx):(river&&dy?frog.x:Math.round(frog.x));nx=Math.max(0,Math.min(COLS-1,nx));const nr=frog.r+dy;if(nr<0||nr>=ROWS)return;frog.x=nx;frog.r=nr;frog.ang=dx?(dx>0?1.57:-1.57):(dy<0?3.14:0);sfx.hop();if(nr>frog.maxr){frog.maxr=nr;S.score+=10*S.mult;hud()}if(nr===ROWS-1)openGate()}
addEventListener('keydown',e=>{const t=e.target,ae=document.activeElement;if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))||t.isContentEditable)return;const k=e.key.toLowerCase(),m={arrowup:[0,1],w:[0,1],arrowdown:[0,-1],s:[0,-1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m&&S.st==='play'){e.preventDefault();move(...m)}});
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(...b.dataset.m.split(',').map(Number))}));
let tx,ty;C.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault()},{passive:false});
C.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.hypot(dx,dy)<14)return move(0,1);Math.abs(dx)>Math.abs(dy)?move(dx>0?1:-1,0):move(0,dy<0?1:-1)});

/* gate / quiz */
function openGate(){S.st='quiz';S.mist=0;S.qt0=Date.now();S.q=S.q||QS[S.order[S.round%S.order.length]];const q=S.q,b=$('body');pick=null;$('q').textContent=q.q;$('fb').innerHTML='';
 if(q.type==='mcq'){b.innerHTML=q.ch.map(()=>'<button class="opt"></button>').join('');b.querySelectorAll('.opt').forEach((el,i)=>{el.textContent=q.ch[i];el.onclick=()=>{b.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');pick=i}})}
 else b.innerHTML='<label for="ans">Type your answer</label><textarea id="ans" rows="4"></textarea>';
 $('gate').classList.add('on')}
function judge(){const q=S.q;if(q.type==='mcq')return{ok:pick===q.a,ans:pick==null?'(no choice)':q.ch[pick],model:q.ch[q.a]};
 const a=$('ans').value,l=a.toLowerCase(),miss=q.kw.filter(k=>!l.includes(k.toLowerCase())),need=Math.ceil(q.kw.length*.6);return{ok:q.kw.length-miss.length>=need,ans:a||'(empty)',model:q.m,miss}}
document.getElementById('sub').onclick=()=>{const r=judge(),q=S.q;sheet({question:q.q,answer:r.ans,correct:r.ok,attempt:r.ok?S.mist+1:S.mist+1});
 if(r.ok){document.getElementById('gate').classList.remove('on');sfx.win();burst(COLS*cs/2,cs*.8,120);S.score+=100*S.mult;S.mult=Math.min(S.mult+1,5);S.q=null;S.st='leap';S.leap=0;hud();banner('Gate open!',1200);return}
 sfx.buzz();const t=document.getElementById('term');t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');S.mist++;let msg;
 if(S.mist===1){S.hearts--;sfx.alarm();msg='Energy Low! You lost a heart.';hud();if(S.hearts<=0){document.getElementById('gate').classList.remove('on');return finish(false)}}
 else if(S.mist===2){S.sink=10;msg='Critical Warning! A river log is sinking.'}
 else{msg='Mission Failed - Try Again!';banner(msg,1500);later(()=>{document.getElementById('gate').classList.remove('on');reset();S.st='play'},1300)}
 const ch=r.miss&&r.miss.length?'<div>Missing ideas: '+r.miss.map(m=>'<span class="chip">'+m+'</span>').join('')+'</div>':'';
 document.getElementById('fb').innerHTML='<b style="color:var(--bad)">'+msg+'</b>'+ch+'<div class="cmp"><div><b>Your answer</b><br><span id="ya"></span></div><div><b>Model answer</b><br><span id="ma"></span></div></div>';
 document.getElementById('ya').textContent=r.ans;document.getElementById('ma').textContent=r.model};

/* logging: stored locally for the Results tab and posted to the Apps Script URL when one is set */
function post(u,r){try{fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(r)}).catch(()=>{})}catch(e){}}
function sheet(d){const rec=Object.assign({time:new Date().toISOString(),name:S.name,gate:S.round+1,score:S.score,duration:Math.round((Date.now()-(S.qt0||S.t0))/1000)},d);const a=ld('fsr',[]);a.push(rec);sv('fsr',a.slice(-500));const u=S.url||ld('fsq_url','');if(u)post(u,rec)}

function finish(win){S.st='over';if(win){S.score+=S.hearts*50;hud()}document.getElementById('et').textContent=win?'Final victory!':'Out of energy';document.getElementById('ep').textContent=(win?'The frog reached the Science Pond. ':'The frog needs a rest. ')+'Final score: '+S.score+'.';document.getElementById('end').classList.add('on');if(win)sfx.win();sheet({question:'(game end)',answer:win?'win':'lose',correct:win,attempt:0})}

/* drawing */
function rr(x,y,w,h,r,f){X.beginPath();X.roundRect(x,y,w,h,r);X.fillStyle=f;X.fill()}
function drawFrog(px,py,a,sc,sq){X.save();X.translate(px,py);X.rotate(a);X.scale(sc,sc*sq);const g='#35c759';X.fillStyle='#1f8f3d';[[-1,.55],[1,.55],[-1,-.5],[1,-.5]].forEach(([sx,sy])=>{X.beginPath();X.ellipse(sx*cs*.3,sy*cs*.25,cs*.14,cs*.2,sx*.5,0,7);X.fill()});X.fillStyle=g;X.beginPath();X.ellipse(0,0,cs*.3,cs*.36,0,0,7);X.fill();X.fillStyle='#b9f5a0';X.beginPath();X.ellipse(0,cs*.06,cs*.17,cs*.2,0,0,7);X.fill();[-1,1].forEach(s=>{X.fillStyle='#fff';X.beginPath();X.arc(s*cs*.15,-cs*.28,cs*.11,0,7);X.fill();X.fillStyle='#111';X.beginPath();X.arc(s*cs*.15,-cs*.3,cs*.05,0,7);X.fill()});X.restore()}
function draw(){const th=S.th,w=COLS*cs;const band=(r0,r1,c)=>{X.fillStyle=c;X.fillRect(0,(ROWS-1-r1)*cs,w,(r1-r0+1)*cs)};
 band(0,0,th.grass);band(1,4,th.road);band(5,5,th.grass);band(6,8,th.water);band(9,9,th.bank);
 X.strokeStyle=th.line;X.lineWidth=3;X.setLineDash([cs*.4,cs*.4]);for(let r=2;r<=4;r++){X.beginPath();X.moveTo(0,(ROWS-r)*cs);X.lineTo(w,(ROWS-r)*cs);X.stroke()}X.setLineDash([]);
 X.strokeStyle='#ffffff55';X.lineWidth=2;for(let r=6;r<=8;r++)for(let i=0;i<6;i++){const y=(ROWS-r-.5)*cs+Math.sin(T*2+i+r)*4,x=((i*1.7+T*.4*(r%2?1:-1))%COLS+COLS)%COLS*cs;X.beginPath();X.moveTo(x,y);X.quadraticCurveTo(x+cs*.3,y-5,x+cs*.6,y);X.stroke()}
 /* gate terminal */
 const gx=w/2-cs*.7,gy=0;rr(gx,gy+cs*.1,cs*1.4,cs*.85,8,'#0b2230');rr(gx+4,gy+cs*.1+4,cs*1.4-8,cs*.5,5,'#38f2c0');X.fillStyle='#0b2230';X.fillRect(gx+cs*.25,gy+cs*.28,cs*.5,3);X.fillRect(gx+cs*.25,gy+cs*.4,cs*.8,3);
 lanes.forEach(l=>{const y=(ROWS-1-l.r)*cs;l.o.forEach(o=>{const x=o.x*cs,ow=o.w*cs;
  if(l.k==='road'){rr(x,y+cs*.14,ow,cs*.72,8,o.c);rr(x+(l.dir>0?ow*.62:ow*.08),y+cs*.22,ow*.3,cs*.3,4,'#d8f3ff');X.fillStyle='#111';[.2,.75].forEach(f=>{X.beginPath();X.arc(x+ow*f,y+cs*.86,cs*.12,0,7);X.fill();X.beginPath();X.arc(x+ow*f,y+cs*.14,cs*.12,0,7);X.fill()})}
  else if(l.k==='log'){const sk=S.sink>0&&l.r===8;rr(x,y+cs*.18,ow,cs*.64,cs*.3,sk?'#5a4636':'#a8683a');X.strokeStyle='#7a4a24';X.lineWidth=2;for(let i=1;i<ow/cs;i++){X.beginPath();X.arc(x+i*cs,y+cs/2,cs*.12,0,7);X.stroke()}if(sk){X.fillStyle='#ffffff88';X.fillRect(x,y+cs*.5,ow,cs*.3)}}
  else{X.fillStyle='#2dbb5d';X.beginPath();X.moveTo(x+ow/2,y+cs/2);X.arc(x+ow/2,y+cs/2,cs*.42,.35,6);X.fill();X.fillStyle='#ff8fb8';X.beginPath();X.arc(x+ow*.6,y+cs*.4,cs*.08,0,7);X.fill()}})});
 let py=(ROWS-.5-frog.dr)*cs,px=(frog.dx+.5)*cs,sc=1,sq=1;if(S.st==='leap'){const p=S.leap;py-=Math.sin(p*3.14)*cs*1.5;sc=1+Math.sin(p*3.14)*.5;px=(frog.x+.5)*cs}
 const hop=Math.abs(frog.dr-frog.r)+Math.abs(frog.dx-frog.x);sq=1+Math.min(hop,1)*.15;if(S.st!=='over')drawFrog(px,py,frog.ang,sc,sq);
 parts.forEach(p=>{X.globalAlpha=Math.max(p.l,0);X.fillStyle=p.c;if(p.s){X.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.57;X.lineTo(p.x+Math.cos(a)*7,p.y+Math.sin(a)*7);X.lineTo(p.x+Math.cos(a+.6283)*3,p.y+Math.sin(a+.6283)*3)}X.fill()}else X.fillRect(p.x,p.y,5,5)});X.globalAlpha=1}

function loop(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;T+=dt;
 if(S.st==='play'||S.st==='quiz'||S.st==='leap'){lanes.forEach(l=>l.o.forEach(o=>{o.x+=l.dir*l.sp*dt;if(l.dir>0&&o.x>COLS+1)o.x-=COLS+6;if(l.dir<0&&o.x+o.w<-1)o.x+=COLS+6}));if(S.sink>0)S.sink-=dt}
 if(S.st==='play'){const l=lanes.find(l=>l.r===frog.r);if(l){const a=frog.x+.2,b=frog.x+.8,hit=l.o.find(o=>b>o.x+.08&&a<o.x+o.w-.08);if(l.k==='road'){if(hit)die('Splat!')}else if(!hit||(l.k==='log'&&S.sink>0&&l.r===8))die('Splash!');else{frog.x+=l.dir*l.sp*dt;if(frog.x<-.4||frog.x>COLS-.6)die('Swept away!')}}}
 if(S.st==='leap'){S.leap+=dt;if(S.leap>=1){S.round++;if(S.round>=GATES)finish(true);else{reset();build();S.st='play';banner('Gate '+(S.round+1)+' - faster!',1200)}}}
 frog.dx+=(frog.x-frog.dx)*Math.min(1,dt*18);frog.dr+=(frog.r-frog.dr)*Math.min(1,dt*18);if(l2()&&0){}
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.l-=dt*.7});parts=parts.filter(p=>p.l>0);draw();requestAnimationFrame(loop)}
function l2(){return 0}

function applyCfg(){S.th=TH[CFG.th]||TH.Day;S.mul={Slow:.7,Normal:1,Fast:1.4}[CFG.sp]||1;document.body.style.background=S.th.water}
function wipe(){TO.splice(0).forEach(clearTimeout);Object.assign(S,{st:'menu',hearts:3,score:0,round:0,mult:1,mist:0,q:null,sink:0,leap:0,t0:Date.now(),qt0:0});parts=[];pick=null;$('body').innerHTML='';$('fb').innerHTML='';$('banner').classList.remove('on');$('gate').classList.remove('on');$('end').classList.remove('on');$('menu').classList.add('on');applyCfg();build();reset();hud()}
let ST=null;
function start(){if(ST===false||!QS.length)return;wipe();S.name=ST||'Teacher test';S.order=QS.map((_,i)=>i).sort(()=>Math.random()-.5);$('menu').classList.remove('on');size();S.st='play'}
$('go').onclick=start;$('again').onclick=wipe;

/* routing: signed student links hide every teacher control */
const P=new URLSearchParams(location.search);
if(P.has('student')){const n=P.get('student'),c=P.get('code')||'';ST=sig(n,c)===P.get('sig')?n:false;
 try{const j=P.get('cfg');if(j){const o=JSON.parse(decodeURIComponent(escape(atob(j))));if(Array.isArray(o.q)&&o.q.length)QS=o.q;if(o.u)S.url=o.u;CFG={th:o.th||'Day',sp:o.sp||'Normal'}}}catch(e){}
 $('tp').remove();$('portal').remove();
 if(ST===false){$('who').textContent='This link is not valid. Ask your teacher for a new one.';$('go').remove()}
 else{$('who').textContent='Student: '+ST;$('go').textContent='Hop In!'}}
else $('who').textContent='Teacher test mode';

/* teacher portal */
if($('portal')){
const tabs=$('tabs');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.p));if(b.dataset.p==='pr')renderR()});
$('tp').onclick=()=>{$('th').value=CFG.th;$('sp').value=CFG.sp;$('surl').value=ld('fsq_url','');renderQ();renderR();$('portal').classList.add('on')};
$('pclose').onclick=()=>$('portal').classList.remove('on');
$('th').onchange=$('sp').onchange=()=>{CFG={th:$('th').value,sp:$('sp').value};sv('fsq_cfg',CFG);wipe()};
function typeUI(){const m=$('qt').value==='mcq';$('qmcq').style.display=m?'block':'none';$('qw').style.display=m?'none':'block'}
$('qt').onchange=typeUI;
function renderQ(){const L=$('qlist');L.innerHTML='<b style="font-size:13px">'+QS.length+' questions</b>';QS.forEach((q,i)=>{const d=document.createElement('div');d.className='qi';d.innerHTML='<span><b>'+esc(q.type)+'</b> '+esc(q.q)+'</span>';const b=document.createElement('button');b.className='sm';b.textContent='Delete';b.onclick=()=>{QS.splice(i,1);sv('fsq_q',QS);renderQ()};d.appendChild(b);L.appendChild(d)})}
$('qadd').onclick=()=>{const t=$('qt').value,q={type:t,q:$('qtext').value.trim(),m:$('qm').value.trim()},m=msg=>$('qs').textContent=msg;if(!q.q)return m('Write the question first.');
 if(t==='mcq'){q.ch=[0,1,2,3].map(i=>$('mc'+i).value.trim()).filter(Boolean);q.a=+$('mca').value;if(q.ch.length<2||q.a>=q.ch.length)return m('Add at least 2 choices and pick a filled one as correct.');q.m=q.m||q.ch[q.a]}
 else{q.kw=$('qk').value.split('|').map(x=>x.trim()).filter(Boolean);if(!q.kw.length)return m('Add at least one keyword.');if(!q.m)return m('Add a model answer.')}
 QS.push(q);sv('fsq_q',QS);['qtext','qk','qm','mc0','mc1','mc2','mc3'].forEach(i=>$(i).value='');m('Question added.');renderQ();wipe()};
$('qreset').onclick=()=>{QS=DEF.slice();sv('fsq_q',QS);renderQ();$('qs').textContent='Defaults restored.';wipe()};
$('lgen').onclick=()=>{const code=$('lcode').value.trim()||'CLASS1',names=$('lnames').value.split('\n').map(x=>x.trim()).filter(Boolean),base=location.href.split('?')[0].split('#')[0];let cfg='';
 if($('linc').checked)cfg='&cfg='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({q:QS,u:ld('fsq_url',''),th:CFG.th,sp:CFG.sp})))));
 const L=$('links');L.innerHTML='';names.forEach(n=>{const u=base+'?student='+encodeURIComponent(n)+'&code='+encodeURIComponent(code)+'&sig='+sig(n,code)+cfg,d=document.createElement('div');d.className='lk';d.innerHTML='<b></b><input readonly><button class="sm" style="margin:0">Copy</button>';d.querySelector('b').textContent=n;const i=d.querySelector('input');i.value=u;d.querySelector('button').onclick=e=>{cp(u);e.target.textContent='Copied'};L.appendChild(d)})};
$('surl').onchange=()=>sv('fsq_url',$('surl').value.trim());
$('stest').onclick=()=>{const u=$('surl').value.trim();sv('fsq_url',u);if(!u)return $('ss').textContent='Paste the web app URL first.';post(u,{time:new Date().toISOString(),name:'TEST',gate:0,question:'Test row',answer:'ok',correct:true,score:0,duration:0});$('ss').textContent='Test row sent. Check your sheet; the browser cannot read the reply.'};
$('scopy').onclick=()=>{cp($('snip').textContent);$('ss').textContent='Apps Script copied.'};
const H=['time','name','gate','question','answer','correct','score','duration'];
function renderR(){const r=ld('fsr',[]);$('rt').innerHTML='<tr>'+H.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+r.slice().reverse().map(x=>'<tr>'+H.map(h=>'<td>'+esc(x[h]??'')+'</td>').join('')+'</tr>').join('')}
function csv(){return[H.join(',')].concat(ld('fsr',[]).map(r=>H.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))).join('\n')}
$('rcsv').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv'}));a.download='science-cross-road-results.csv';document.body.appendChild(a);a.click();a.remove();$('rs').textContent='Download started. If no file appears, use Copy CSV.'}catch(e){cp(csv());$('rs').textContent='Download blocked here; CSV copied instead.'}};
$('rcopy').onclick=()=>{cp(csv());$('rs').textContent='CSV copied.'};
$('rclr').onclick=()=>{sv('fsr',[]);renderR();$('rs').textContent='Results cleared.'};
typeUI()}

size();wipe();requestAnimationFrame(loop);
</script></body></html>
